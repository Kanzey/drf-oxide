[project]
name = "drf-oxide"
version = "0.1.0"
description = "Drop-in, Rust-accelerated serializers, JSON renderer and parser for Django REST framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kamil Kobza", email = "kamil1pl@gmail.com" }]
keywords = ["django", "django-rest-framework", "drf", "serializers", "rust", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2,<6",
    "djangorestframework>=3.14,<3.17",
    "drf-oxide-core>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/Kanzey/drf-oxide"
Repository = "https://github.com/Kanzey/drf-oxide"
Issues = "https://github.com/Kanzey/drf-oxide/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-benchmark>=4",
    "hypothesis>=6",
    "ruff>=0.6",
]

[tool.uv.sources]
drf-oxide-core = { path = "../drf-oxide-core", editable = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "--benchmark-skip"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
